name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shield-full-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build isolated Shield Pro test APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare optional Nuvio API properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Prepare optional persistent Shield APK signing
        env:
          SHIELD_TEST_KEYSTORE_BASE64: ${{ secrets.SHIELD_TEST_KEYSTORE_BASE64 }}
          SHIELD_TEST_STORE_PASSWORD: ${{ secrets.SHIELD_TEST_STORE_PASSWORD }}
          SHIELD_TEST_KEY_ALIAS: ${{ secrets.SHIELD_TEST_KEY_ALIAS }}
          SHIELD_TEST_KEY_PASSWORD: ${{ secrets.SHIELD_TEST_KEY_PASSWORD }}
        run: |
          if [ -z "$SHIELD_TEST_KEYSTORE_BASE64" ]; then
            if [ -n "$SHIELD_TEST_STORE_PASSWORD$SHIELD_TEST_KEY_ALIAS$SHIELD_TEST_KEY_PASSWORD" ]; then
              echo "::error::Incomplete Shield signing secrets (missing SHIELD_TEST_KEYSTORE_BASE64)."
              exit 1
            fi
            echo "::warning::No persistent signing secrets: APK is for one-time smoke testing; later CI APKs cannot update it."
            exit 0
          fi
          for field in SHIELD_TEST_STORE_PASSWORD SHIELD_TEST_KEY_ALIAS SHIELD_TEST_KEY_PASSWORD; do
            if [ -z "${!field}" ]; then
              echo "::error::Shield signing secret $field is missing."
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/shield-pro-test.jks"
          printf '%s' "$SHIELD_TEST_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          keytool -list -keystore "$key_path" -storepass "$SHIELD_TEST_STORE_PASSWORD" -alias "$SHIELD_TEST_KEY_ALIAS" >/dev/null
          {
            echo "SHIELD_SIGNING_STORE_FILE=$key_path"
            echo "SHIELD_SIGNING_STORE_PASSWORD=$SHIELD_TEST_STORE_PASSWORD"
            echo "SHIELD_SIGNING_KEY_ALIAS=$SHIELD_TEST_KEY_ALIAS"
            echo "SHIELD_SIGNING_KEY_PASSWORD=$SHIELD_TEST_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build isolated fullDebug APK
        run: ./gradlew :app:testFullDebugUnitTest :app:assembleFullDebug -PshieldTestBuild=true --stacktrace

      - name: Verify Shield test application ID
        run: |
          apk="app/build/outputs/apk/full/debug/app-full-universal-debug.apk"
          test -s "$apk"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          test -n "$aapt_path"
          package="$("$aapt_path" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          echo "Built application ID: $package"
          test "$package" = "com.nuvio.shieldpro.test"

      - name: Upload Shield Pro test APK
        uses: actions/upload-artifact@v4
        with:
          name: shield-pro-full-debug-${{ github.sha }}
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
